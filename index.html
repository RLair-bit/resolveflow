<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResolveFlow — Apoio ao Cliente</title>
<meta name="description" content="Ferramenta pessoal open-source de apoio ao cliente: árvore de decisão navegável, pesquisa local e assistente de IA opcional.">
<style>
  :root{
    --color-bg:#f5f6fa;
    --color-surface:#ffffff;
    --color-surface-2:#eef0f6;
    --color-border:#e1e4ea;
    --color-text:#1b1f27;
    --color-text-muted:#5b6472;
    --color-header-bg:#12141c;
    --color-header-bg-2:#1b1e2a;
    --color-header-text:#f5f6fa;
    --color-header-text-muted:#9aa0b4;
    --accent:#2D5BE3;
    --accent-hover:#234ac2;
    --accent-soft:rgba(45,91,227,0.10);
    --accent-soft-2:rgba(45,91,227,0.18);
    --success:#1c8a53;
    --success-bg:#e7f6ee;
    --danger:#c0392b;
    --danger-bg:#fdecea;
    --warning-bg:#fff6e0;
    --warning-border:#f0c852;
    --warning-text:#7a5b00;
    --radius:10px;
    --radius-sm:6px;
    --shadow:0 2px 10px rgba(20,22,30,0.06);
    --shadow-lg:0 12px 30px rgba(20,22,30,0.14);
    --font-display:'Space Grotesk','Segoe UI',system-ui,sans-serif;
    --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono','Consolas',monospace;
  }

  /* Tema escuro: segue a preferência do sistema por omissão; o botão no
     cabeçalho pode forçar claro/escuro via [data-theme] em <html>. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --color-bg:#14161d;
      --color-surface:#1b1e28;
      --color-surface-2:#242835;
      --color-border:#333846;
      --color-text:#e7e9f0;
      --color-text-muted:#9aa0b4;
      --accent-soft:rgba(45,91,227,0.22);
      --accent-soft-2:rgba(45,91,227,0.32);
      --success-bg:#123524;
      --danger-bg:#3a1a17;
      --warning-bg:#332a05;
      --warning-text:#f0c852;
      --shadow:0 2px 10px rgba(0,0,0,0.35);
      --shadow-lg:0 12px 30px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --color-bg:#14161d;
    --color-surface:#1b1e28;
    --color-surface-2:#242835;
    --color-border:#333846;
    --color-text:#e7e9f0;
    --color-text-muted:#9aa0b4;
    --accent-soft:rgba(45,91,227,0.22);
    --accent-soft-2:rgba(45,91,227,0.32);
    --success-bg:#123524;
    --danger-bg:#3a1a17;
    --warning-bg:#332a05;
    --warning-text:#f0c852;
    --shadow:0 2px 10px rgba(0,0,0,0.35);
    --shadow-lg:0 12px 30px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--color-bg);
    color:var(--color-text);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,h4{font-family:var(--font-display); margin:0 0 .5em 0;}
  button{font-family:inherit; cursor:pointer;}
  a{color:var(--accent);}
  code, .mono{font-family:var(--font-mono);}

  /* ---------- Layout shell ---------- */
  .app{display:flex; flex-direction:column; min-height:100vh;}

  /* ---------- Header ---------- */
  header.app-header{
    background:linear-gradient(180deg,var(--color-header-bg),var(--color-header-bg-2));
    color:var(--color-header-text);
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto;}
  .brand .logo{
    width:34px; height:34px; border-radius:9px;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; color:#fff; font-size:16px;
    flex:none;
  }
  .brand .title{font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:.2px;}
  .brand .subtitle{font-size:11.5px; color:var(--color-header-text-muted); margin-top:1px;}

  .header-search{
    flex:1 1 320px;
    max-width:460px;
    position:relative;
  }
  .header-search input{
    width:100%;
    padding:9px 12px 9px 34px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.08);
    color:var(--color-header-text);
    font-size:14px;
    outline:none;
    transition:background .15s, border-color .15s;
  }
  .header-search input::placeholder{color:var(--color-header-text-muted);}
  .header-search input:focus{background:rgba(255,255,255,0.14); border-color:var(--accent);}
  .header-search .icon{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    color:var(--color-header-text-muted); font-size:14px; pointer-events:none;
  }

  /* Mode toggle */
  .mode-toggle{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:999px;
    padding:3px;
    gap:2px;
    flex:none;
  }
  .mode-toggle button{
    border:none;
    background:transparent;
    color:var(--color-header-text-muted);
    font-size:12.5px;
    font-weight:600;
    padding:7px 13px;
    border-radius:999px;
    transition:background .15s, color .15s;
    white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  .mode-toggle button.active{
    background:var(--accent);
    color:#fff;
  }
  .mode-toggle button:not(.active):hover{color:#fff;}

  /* ---------- Privacy banner ---------- */
  .privacy-banner{
    background:var(--warning-bg);
    border-bottom:1px solid var(--warning-border);
    color:var(--warning-text);
    font-size:12.5px;
    padding:8px 20px;
    display:flex;
    align-items:flex-start;
    gap:8px;
  }
  .privacy-banner.online{
    background:var(--danger-bg);
    border-bottom-color:#eabdb6;
    color:#7a2317;
  }
  .privacy-banner strong{font-weight:700;}
  .privacy-banner .ico{flex:none; margin-top:1px;}

  /* ---------- Main layout ---------- */
  .layout{
    flex:1;
    display:grid;
    grid-template-columns:280px 1fr;
    gap:0;
    max-width:1280px;
    width:100%;
    margin:0 auto;
    align-items:start;
  }
  @media (max-width: 860px){
    .layout{grid-template-columns:1fr;}
  }

  nav.tree{
    padding:20px 14px 40px 20px;
    position:sticky;
    top:0;
  }
  @media (max-width: 860px){ nav.tree{position:static;} }

  .tree h2{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--color-text-muted); margin-bottom:10px;}

  .category{margin-bottom:4px;}
  .category-btn{
    width:100%;
    display:flex; align-items:center; gap:8px;
    background:none; border:none;
    text-align:left;
    padding:9px 10px;
    border-radius:var(--radius-sm);
    font-size:14px; font-weight:600;
    color:var(--color-text);
  }
  .category-btn:hover{background:var(--color-surface-2);}
  .category-btn .chev{
    margin-left:auto; font-size:10px; color:var(--color-text-muted);
    transition:transform .15s;
  }
  .category.open .category-btn .chev{transform:rotate(90deg);}
  .category-btn .emoji{font-size:15px;}

  .subtopic-list{list-style:none; margin:2px 0 8px 0; padding:0 0 0 30px; display:none;}
  .category.open .subtopic-list{display:block;}
  .subtopic-list li button{
    width:100%; text-align:left; background:none; border:none;
    padding:6px 8px; border-radius:var(--radius-sm);
    font-size:13.5px; color:var(--color-text-muted);
  }
  .subtopic-list li button:hover{background:var(--color-surface-2); color:var(--color-text);}
  .subtopic-list li button.selected{background:var(--accent-soft); color:var(--accent-hover); font-weight:600;}

  /* ---------- Content ---------- */
  main.content{
    padding:24px 24px 60px 20px;
    min-width:0;
  }

  .breadcrumb{font-size:12.5px; color:var(--color-text-muted); margin-bottom:14px;}
  .breadcrumb .sep{margin:0 6px;}

  .card{
    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px 24px;
  }

  .welcome ul{padding-left:20px; color:var(--color-text-muted); font-size:14px;}
  .welcome li{margin-bottom:6px;}

  .resolution-summary{color:var(--color-text-muted); margin-bottom:16px; font-size:14px;}
  .steps{list-style:none; margin:0; padding:0; counter-reset:step;}
  .steps li{
    counter-increment:step;
    display:flex; gap:12px;
    padding:10px 0;
    border-top:1px solid var(--color-border);
    font-size:14.5px;
  }
  .steps li:first-child{border-top:none;}
  .steps li::before{
    content:counter(step);
    flex:none;
    width:24px; height:24px;
    background:var(--accent-soft);
    color:var(--accent-hover);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; font-family:var(--font-display);
    margin-top:1px;
  }

  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:18px;}
  .tag{
    font-size:11.5px; background:var(--color-surface-2); color:var(--color-text-muted);
    padding:3px 9px; border-radius:999px;
  }

  /* ---------- Search results ---------- */
  .search-results h3{font-size:14px; margin-bottom:12px;}
  .result-item{
    display:block; width:100%; text-align:left;
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:8px;
    cursor:pointer;
  }
  .result-item:hover{border-color:var(--accent); box-shadow:var(--shadow);}
  .result-item .path{font-size:11.5px; color:var(--color-text-muted); margin-bottom:2px;}
  .result-item .title{font-weight:600; font-size:14.5px;}
  .result-item .snippet{font-size:12.5px; color:var(--color-text-muted); margin-top:4px;}

  .no-results-box{
    background:var(--color-surface); border:1px dashed var(--color-border);
    border-radius:var(--radius); padding:24px; text-align:center;
  }
  .no-results-box p{color:var(--color-text-muted); margin:0 0 14px 0; font-size:14px;}
  .btn{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--accent); color:#fff; border:none;
    padding:9px 16px; border-radius:var(--radius-sm);
    font-size:13.5px; font-weight:600; text-decoration:none;
  }
  .btn:hover{background:var(--accent-hover);}
  .btn.secondary{background:var(--color-surface-2); color:var(--color-text);}
  .btn.secondary:hover{background:#e2e5ee;}
  .btn.danger{background:var(--danger-bg); color:var(--danger);}
  .btn.danger:hover{background:#f8d9d5;}
  .btn:disabled{opacity:.55; cursor:not-allowed;}

  /* ---------- Online / AI section ---------- */
  .ai-section{margin-top:22px;}
  .ai-key-card{
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius); padding:20px 22px; margin-bottom:18px;
  }
  .ai-key-card h3{font-size:15px;}
  .ai-key-card p{font-size:13px; color:var(--color-text-muted); margin:0 0 12px 0;}
  .ai-key-card .row{display:flex; gap:8px; flex-wrap:wrap;}
  .ai-key-card input[type="password"], .ai-key-card input[type="text"]{
    flex:1 1 260px;
    padding:9px 11px; border:1px solid var(--color-border); border-radius:var(--radius-sm);
    font-family:var(--font-mono); font-size:13px;
  }
  .key-status{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:13px;
  }
  .key-status .dot{width:8px; height:8px; border-radius:50%; background:var(--success); flex:none;}
  .key-status .masked{font-family:var(--font-mono); color:var(--color-text-muted);}

  .chat-panel{
    background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius); overflow:hidden;
  }
  .chat-log{
    max-height:420px; min-height:120px; overflow-y:auto;
    padding:18px 20px; display:flex; flex-direction:column; gap:14px;
  }
  .chat-msg{max-width:85%; font-size:14px; line-height:1.55;}
  .chat-msg.user{align-self:flex-end; text-align:right;}
  .chat-msg .bubble{
    display:inline-block; padding:10px 14px; border-radius:14px;
    white-space:pre-wrap; text-align:left;
  }
  .chat-msg.user .bubble{background:var(--accent); color:#fff; border-bottom-right-radius:4px;}
  .chat-msg.assistant .bubble{background:var(--color-surface-2); color:var(--color-text); border-bottom-left-radius:4px;}
  .chat-msg.system .bubble{background:var(--warning-bg); color:var(--warning-text); border:1px solid var(--warning-border);}
  .chat-msg.error .bubble{background:var(--danger-bg); color:var(--danger); border:1px solid #eabdb6;}
  .chat-msg .role-label{font-size:11px; color:var(--color-text-muted); margin-bottom:3px;}

  .suggestion-card{
    border:1px solid var(--accent-soft-2); background:var(--accent-soft);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:13.5px;
  }
  .suggestion-card .title{font-weight:700; margin-bottom:4px;}
  .suggestion-card .actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}

  .chat-input-row{
    display:flex; gap:8px; padding:14px 16px; border-top:1px solid var(--color-border);
    background:var(--color-surface-2);
  }
  .chat-input-row textarea{
    flex:1; resize:none; border:1px solid var(--color-border); border-radius:var(--radius-sm);
    padding:9px 11px; font-family:var(--font-body); font-size:14px; min-height:42px; max-height:140px;
  }
  .chat-typing{font-size:12.5px; color:var(--color-text-muted); padding:0 20px 10px 20px; display:none;}
  .chat-typing.active{display:block;}

  .hidden{display:none !important;}

  footer.app-footer{
    text-align:center; font-size:12px; color:var(--color-text-muted);
    padding:20px; border-top:1px solid var(--color-border);
  }
  footer.app-footer a{color:var(--color-text-muted); text-decoration:underline;}
  footer.app-footer .danger-link{
    background:none; border:none; color:var(--danger); text-decoration:underline;
    font-size:12px; cursor:pointer; padding:0;
  }

  /* ---------- Botão de ícone (tema) ---------- */
  .icon-btn{
    border:1px solid rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.08);
    color:var(--color-header-text);
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; flex:none;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.16);}

  /* ---------- Destaque de pesquisa ---------- */
  mark{background:rgba(45,91,227,0.30); color:inherit; border-radius:3px; padding:0 2px;}

  /* ---------- Favoritos / Recentes (barra lateral) ---------- */
  .side-section{margin-bottom:16px;}
  .side-section h3{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--color-text-muted); margin-bottom:6px;}
  .side-section ul{list-style:none; margin:0; padding:0;}
  .side-section li button{
    width:100%; text-align:left; background:none; border:none; padding:5px 8px;
    border-radius:var(--radius-sm); font-size:13px; color:var(--color-text-muted);
  }
  .side-section li button:hover{background:var(--color-surface-2); color:var(--color-text);}
  .side-section .empty-hint{font-size:12px; color:var(--color-text-muted); padding:2px 8px; font-style:italic;}

  /* ---------- Toolbar da resolução (copiar/imprimir/favorito/feedback) ---------- */
  .resolution-toolbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-top:18px; padding-top:16px; border-top:1px solid var(--color-border);
  }
  .icon-text-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--color-surface-2); color:var(--color-text); border:none;
    padding:7px 12px; border-radius:var(--radius-sm); font-size:12.5px; font-weight:600;
  }
  .icon-text-btn:hover{background:var(--accent-soft);}
  .icon-text-btn.active{background:var(--accent-soft); color:var(--accent-hover);}
  .feedback-row{display:flex; align-items:center; gap:6px; margin-left:auto;}
  .feedback-row .label{font-size:12px; color:var(--color-text-muted);}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(6px);
    background:var(--color-header-bg); color:#fff; padding:10px 18px; border-radius:999px;
    font-size:13px; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:1000; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- Markdown dentro das bolhas de chat ---------- */
  .bubble strong{font-weight:700;}
  .bubble em{font-style:italic;}
  .bubble code{background:rgba(0,0,0,0.08); padding:1px 5px; border-radius:4px; font-family:var(--font-mono); font-size:.92em;}
  .bubble pre{background:rgba(0,0,0,0.08); padding:10px 12px; border-radius:8px; overflow-x:auto; margin:8px 0;}
  .bubble pre code{background:none; padding:0;}
  .bubble ul{margin:6px 0; padding-left:20px;}
  .bubble a{text-decoration:underline;}
  .chat-msg.assistant .bubble code, .chat-msg.assistant .bubble pre{background:rgba(255,255,255,0.08);}
  .bubble.cursor-blink::after{content:"▍"; animation:rf-blink 1s step-start infinite; color:var(--accent);}
  @keyframes rf-blink{50%{opacity:0;}}

  /* ---------- Ações do chat (parar / limpar) ---------- */
  .chat-actions-row{display:flex; justify-content:flex-end; gap:8px; padding:10px 16px 0 16px;}
  .chat-actions-row .btn{font-size:11.5px; padding:5px 10px;}

  /* ---------- Impressão ---------- */
  @media print{
    header.app-header, nav.tree, .privacy-banner, footer.app-footer,
    .ai-section, .resolution-toolbar, .search-results, .toast{ display:none !important; }
    body{background:#fff; color:#000;}
    .layout{grid-template-columns:1fr; max-width:none;}
    main.content{padding:0;}
    .card{box-shadow:none; border:none;}
  }
</style>
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="brand">
      <div class="logo">RF</div>
      <div>
        <div class="title">ResolveFlow</div>
        <div class="subtitle">Apoio ao cliente — árvore de decisão local</div>
      </div>
    </div>

    <div class="header-search">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Pesquisar por palavra-chave (ex.: password, reembolso, atraso)…" autocomplete="off">
    </div>

    <button type="button" class="icon-btn" id="btnThemeToggle" title="Mudar tema" aria-label="Mudar tema claro/escuro">🌙</button>

    <div class="mode-toggle" role="tablist" aria-label="Modo de funcionamento">
      <button type="button" id="btnModeOffline" role="tab" aria-selected="true">
        <span>🔒</span><span>Offline</span>
      </button>
      <button type="button" id="btnModeOnline" role="tab" aria-selected="false">
        <span>✨</span><span>Online (IA)</span>
      </button>
    </div>
  </header>

  <div class="privacy-banner" id="privacyBanner">
    <span class="ico">⚠️</span>
    <span id="privacyBannerText"></span>
  </div>

  <div class="layout">
    <nav class="tree" id="treeNav" aria-label="Árvore de categorias">
      <div id="sideLists"></div>
      <h2>Categorias</h2>
      <div id="treeContainer"></div>
    </nav>

    <main class="content" id="content">
      <!-- populated by JS -->
    </main>
  </div>

  <footer class="app-footer">
    ResolveFlow — ferramenta pessoal e open-source de apoio ao cliente. Não substitui as políticas de confidencialidade do teu empregador.
    <br>Consulta o <a href="README.md">README</a> para mais informação sobre os modos e privacidade.
    <br><button type="button" class="danger-link" id="btnClearAllData">Apagar todos os dados locais desta app (chave, favoritos, histórico, feedback)</button>
  </footer>

</div>

<script>
(function(){
  "use strict";

  /* =========================================================================
     CONFIGURAÇÃO — muda aqui o modelo / endpoint da IA se precisares.
     A chave de API NUNCA é lida a partir daqui: é sempre pedida ao
     utilizador em runtime e guardada apenas em localStorage do browser.
     ========================================================================= */
  const AI_CONFIG = {
    provider: "anthropic",
    apiEndpoint: "https://api.anthropic.com/v1/messages",
    model: "claude-sonnet-5",     // <- muda o modelo Claude aqui
    apiVersion: "2023-06-01",
    maxTokens: 1024,
    systemPrompt:
      "és um assistente de apoio ao cliente; responde de forma clara, " +
      "cordial e passo-a-passo, em português europeu. Se a pergunta " +
      "envolver dados pessoais, credenciais ou informação confidencial, " +
      "recorda ao utilizador para não partilhar esses dados aqui. " +
      "Quando fizer sentido, estrutura a resposta em passos numerados."
  };

  // Chat de IA genérico usado no MODO OFFLINE quando a pesquisa local

  /* ---------------------------------------------------------------------
     UTILITÁRIOS
     --------------------------------------------------------------------- */
  function normalize(str){
    return (str || "")
      .toString()
      .toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, ""); // remove acentos
  }

  function escapeHtml(str){
    return (str || "").toString()
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function findCategoryAndSub(catId, subId){
    const cat = TREE.find(c => c.id === catId);
    if(!cat) return null;
    const sub = cat.subtopics.find(s => s.id === subId);
    if(!sub) return null;
    return {cat, sub};
  }

  /* ---------------------------------------------------------------------
     TOAST — pequena notificação temporária no fundo do ecrã
     --------------------------------------------------------------------- */
  function showToast(msg){
    let t = document.getElementById("toast");
    if(!t){
      t = document.createElement("div");
      t.id = "toast";
      t.className = "toast";
      t.setAttribute("role", "status");
      t.setAttribute("aria-live", "polite");
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  /* ---------------------------------------------------------------------
     ÁREA DE TRANSFERÊNCIA
     --------------------------------------------------------------------- */
  function fallbackCopy(text, toastMsg){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{
      document.execCommand("copy");
      showToast(toastMsg);
    } catch(e){
      showToast("Não foi possível copiar. Copia manualmente.");
    }
    document.body.removeChild(ta);
  }
  function copyToClipboard(text, toastMsg){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(
        () => showToast(toastMsg),
        () => fallbackCopy(text, toastMsg)
      );
    } else {
      fallbackCopy(text, toastMsg);
    }
  }

  /* ---------------------------------------------------------------------
     TEMA — claro / escuro / segue o sistema, persistido em localStorage
     --------------------------------------------------------------------- */
  function getStoredTheme(){
    return localStorage.getItem(LS_KEYS.theme) || "";
  }
  function applyTheme(theme){
    if(theme === "dark" || theme === "light"){
      document.documentElement.setAttribute("data-theme", theme);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
    const btn = document.getElementById("btnThemeToggle");
    if(btn){
      const isDark = theme === "dark" ||
        (theme !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      btn.textContent = isDark ? "☀️" : "🌙";
      btn.title = isDark ? "Mudar para tema claro" : "Mudar para tema escuro";
    }
  }
  function toggleTheme(){
    const current = getStoredTheme();
    const isDark = current === "dark" ||
      (current !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    const next = isDark ? "light" : "dark";
    localStorage.setItem(LS_KEYS.theme, next);
    applyTheme(next);
  }

  /* ---------------------------------------------------------------------
     DESTAQUE DE TERMOS DE PESQUISA
     --------------------------------------------------------------------- */
  function highlightTerms(text, terms){
    let html = escapeHtml(text);
    const uniqueTerms = Array.from(new Set(terms.filter(t => t && t.length > 1)))
      .sort((a, b) => b.length - a.length);
    uniqueTerms.forEach(term => {
      const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const re = new RegExp("(" + escapedTerm + ")", "gi");
      html = html.replace(re, "<mark>$1</mark>");
    });
    return html;
  }

  /* ---------------------------------------------------------------------
     FAVORITOS E VISTOS RECENTEMENTE — persistidos em localStorage
     --------------------------------------------------------------------- */
  function getList(key){
    try{ return JSON.parse(localStorage.getItem(key) || "[]"); } catch(e){ return []; }
  }
  function setList(key, list){
    localStorage.setItem(key, JSON.stringify(list));
  }
  function pushRecent(catId, subId){
    let list = getList(LS_KEYS.recent).filter(i => !(i.catId === catId && i.subId === subId));
    list.unshift({catId, subId});
    list = list.slice(0, 5);
    setList(LS_KEYS.recent, list);
    renderSideLists();
  }
  function isFavorite(catId, subId){
    return getList(LS_KEYS.favorites).some(i => i.catId === catId && i.subId === subId);
  }
  function toggleFavorite(catId, subId){
    let list = getList(LS_KEYS.favorites);
    if(isFavorite(catId, subId)){
      list = list.filter(i => !(i.catId === catId && i.subId === subId));
      showToast("Removido dos favoritos.");
    } else {
      list.unshift({catId, subId});
      showToast("Adicionado aos favoritos.");
    }
    setList(LS_KEYS.favorites, list);
    renderSideLists();
  }
  function renderSideLists(){
    const container = document.getElementById("sideLists");
    if(!container) return;

    function renderGroup(title, items, emptyHint){
      if(items.length === 0){
        return `<div class="side-section"><h3>${title}</h3><div class="empty-hint">${emptyHint}</div></div>`;
      }
      const rows = items.map(i => {
        const found = findCategoryAndSub(i.catId, i.subId);
        if(!found) return "";
        return `<li><button type="button" data-cat="${i.catId}" data-sub="${i.subId}">${escapeHtml(found.sub.title)}</button></li>`;
      }).join("");
      return `<div class="side-section"><h3>${title}</h3><ul>${rows}</ul></div>`;
    }

    container.innerHTML =
      renderGroup("⭐ Favoritos", getList(LS_KEYS.favorites), "Ainda sem favoritos.") +
      renderGroup("🕘 Recentes", getList(LS_KEYS.recent), "Ainda sem histórico.");

    container.querySelectorAll("button[data-cat]").forEach(btn => {
      btn.addEventListener("click", () => selectSubtopic(btn.dataset.cat, btn.dataset.sub));
    });
  }

  /* ---------------------------------------------------------------------
     FEEDBACK ("Foi útil?") por resolução — persistido em localStorage
     --------------------------------------------------------------------- */
  function getFeedback(catId, subId){
    let all = {};
    try{ all = JSON.parse(localStorage.getItem(LS_KEYS.feedback) || "{}"); } catch(e){}
    return all[catId + "/" + subId] || {up: 0, down: 0, voted: null};
  }
  function setVote(catId, subId, vote){
    let all = {};
    try{ all = JSON.parse(localStorage.getItem(LS_KEYS.feedback) || "{}"); } catch(e){}
    const key = catId + "/" + subId;
    const current = all[key] || {up: 0, down: 0, voted: null};
    if(current.voted !== vote){
      if(current.voted === "up") current.up = Math.max(0, current.up - 1);
      if(current.voted === "down") current.down = Math.max(0, current.down - 1);
      if(vote === "up") current.up += 1;
      if(vote === "down") current.down += 1;
      current.voted = vote;
    }
    all[key] = current;
    localStorage.setItem(LS_KEYS.feedback, JSON.stringify(all));
    return current;
  }
  function wireFeedbackButtons(catId, subId){
    const fb = getFeedback(catId, subId);
    const upBtn = document.getElementById("btnFeedbackUp");
    const downBtn = document.getElementById("btnFeedbackDown");
    const upCount = document.getElementById("fbUpCount");
    const downCount = document.getElementById("fbDownCount");
    if(!upBtn || !downBtn) return;

    upCount.textContent = fb.up || "";
    downCount.textContent = fb.down || "";
    upBtn.classList.toggle("active", fb.voted === "up");
    downBtn.classList.toggle("active", fb.voted === "down");

    upBtn.addEventListener("click", () => {
      const updated = setVote(catId, subId, "up");
      upCount.textContent = updated.up || "";
      downCount.textContent = updated.down || "";
      upBtn.classList.add("active");
      downBtn.classList.remove("active");
      showToast("Obrigado pelo feedback!");
    });
    downBtn.addEventListener("click", () => {
      const updated = setVote(catId, subId, "down");
      upCount.textContent = updated.up || "";
      downCount.textContent = updated.down || "";
      downBtn.classList.add("active");
      upBtn.classList.remove("active");
      showToast("Obrigado pelo feedback!");
    });
  }

  /* ---------------------------------------------------------------------
     LIGAÇÕES DIRETAS (URL#categoria/subtopico) — partilháveis, com
     suporte a avançar/recuar do browser
     --------------------------------------------------------------------- */
  function updateHash(catId, subId){
    const newHash = "#" + catId + "/" + subId;
    if(location.hash !== newHash){
      history.pushState(null, "", newHash);
    }
  }
  function parseHash(){
    const h = location.hash.replace(/^#/, "");
    if(!h) return null;
    const parts = h.split("/");
    if(parts.length !== 2 || !parts[0] || !parts[1]) return null;
    return {catId: parts[0], subId: parts[1]};
  }
  function applyHashRoute(){
    const h = parseHash();
    if(h && findCategoryAndSub(h.catId, h.subId)){
      selectSubtopic(h.catId, h.subId, {skipHash: true});
      return true;
    }
    return false;
  }

  /* ---------------------------------------------------------------------
     ATALHOS DE TECLADO
     --------------------------------------------------------------------- */
  function wireKeyboardShortcuts(){
    document.addEventListener("keydown", (e) => {
      const tag = (document.activeElement && document.activeElement.tagName) || "";
      const typing = tag === "INPUT" || tag === "TEXTAREA";

      if((e.key === "/" && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")){
        e.preventDefault();
        const input = document.getElementById("searchInput");
        input.focus();
        input.select();
        return;
      }
      if(e.key === "Escape"){
        const input = document.getElementById("searchInput");
        if(document.activeElement === input && input.value){
          input.value = "";
          if(state.selected){ renderResolution(state.selected.catId, state.selected.subId); }
          else { renderWelcome(); }
        } else if(document.activeElement === input){
          input.blur();
        }
      }
    });
  }

  /* ---------------------------------------------------------------------
     PESQUISA LOCAL — usada pelo modo offline e como 1º passo do modo online
     --------------------------------------------------------------------- */
  function searchLocal(query){
    const q = normalize(query).trim();
    if(!q) return [];
    const terms = q.split(/\s+/).filter(Boolean);
    const results = [];

    TREE.forEach(cat => {
      cat.subtopics.forEach(sub => {
        const haystack = normalize([
          sub.title, sub.summary, (sub.keywords||[]).join(" "), sub.steps.join(" ")
        ].join(" "));

        let score = 0;
        terms.forEach(t => {
          if(haystack.indexOf(t) !== -1) score += 1;
          if(normalize(sub.title).indexOf(t) !== -1) score += 2;
          (sub.keywords||[]).forEach(k => { if(normalize(k).indexOf(t) !== -1) score += 2; });
        });

        if(score > 0){
          results.push({cat, sub, score});
        }
      });
    });

    results.sort((a,b) => b.score - a.score);
    return results;
  }

      wrap.className = "category";

      const btn = document.createElement("button");

      btn.className = "category-btn";
      btn.innerHTML = `<span class="emoji">${cat.emoji}</span><span>${escapeHtml(cat.name)}</span><span class="chev">▶</span>`;
      btn.addEventListener("click", () => {
        wrap.classList.toggle("open");
      });

      const ul = document.createElement("ul");
      ul.className = "subtopic-list";
      cat.subtopics.forEach(sub => {
        const li = document.createElement("li");
        const subBtn = document.createElement("button");

      });

    });

              <div class="snippet">${highlightTerms(r.sub.summary, rawTerms)}</div>

  /* =========================================================================
     MODO ONLINE (IA) — gestão da chave, chat e chamada à API Anthropic

  function getApiKey(){

    localStorage.setItem(LS_KEYS.apiKey, key.trim());

  function clearApiKey(){

  }
  function maskKey(key){
    if(key.length <= 8) return "•".repeat(key.length);
    return key.slice(0,4) + "…" + key.slice(-4);
  }

          </div>

  function wireAiSection(){
    const saveBtn = document.getElementById("btnSaveKey");
    if(saveBtn){
      saveBtn.addEventListener("click", () => {
        const input = document.getElementById("apiKeyInput");
        const val = input.value.trim();
        if(!val){ input.focus(); return; }
        setApiKey(val);
        rerenderCurrentPanelKeepingChat();
      });
    }
    const clearBtn = document.getElementById("btnClearKey");
    if(clearBtn){
      clearBtn.addEventListener("click", () => {
        if(confirm("Remover a chave de API guardada neste browser?")){
          clearApiKey();
          state.chatHistory = [];
          sessionStorage.removeItem(LS_KEYS.chatSession);
          rerenderCurrentPanelKeepingChat();
        }
      });
    }
    const testBtn = document.getElementById("btnTestKey");
    if(testBtn){
      testBtn.addEventListener("click", testApiKey);
    }

    const stopBtn = document.getElementById("btnStopChat");
    if(stopBtn){
      stopBtn.addEventListener("click", () => {
        if(state.abortController) state.abortController.abort();
      });
    }
    const clearChatBtn = document.getElementById("btnClearChat");
    if(clearChatBtn){
      clearChatBtn.addEventListener("click", () => {
        if(state.chatHistory.length === 0) return;
        if(confirm("Limpar toda a conversa desta sessão?")){
          state.chatHistory = [];
          sessionStorage.removeItem(LS_KEYS.chatSession);
          renderChatHistory();
          showToast("Conversa limpa.");
        }
      });
    }

    const sendBtn = document.getElementById("btnSendChat");
    const chatInput = document.getElementById("chatInput");
    if(sendBtn && chatInput){
      renderChatHistory();
      sendBtn.addEventListener("click", () => handleSendChat());
      chatInput.addEventListener("keydown", (e) => {
        if(e.key === "Enter" && !e.shiftKey){
          e.preventDefault();
          handleSendChat();
        }
      });
      chatInput.addEventListener("input", () => {
        chatInput.style.height = "auto";
        chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + "px";
      });
    }
  }

  function rerenderCurrentPanelKeepingChat(){
    const q = document.getElementById("searchInput").value.trim();
    if(q){ renderSearchResults(q); }
    else if(state.selected){ renderResolution(state.selected.catId, state.selected.subId); }
    else { renderWelcome(); }
  }

  function renderChatHistory(){
    const log = document.getElementById("chatLog");
    if(!log) return;
    log.innerHTML = "";
    state.chatHistory.forEach(msg => appendChatBubble(msg.role, msg.content, false));
    log.scrollTop = log.scrollHeight;
  }

  function appendChatBubble(role, htmlOrText, isHtml){
    const log = document.getElementById("chatLog");
    if(!log) return null;
    const wrap = document.createElement("div");
    wrap.className = "chat-msg " + role;
    const label = {
      user: "Tu", assistant: "Assistente IA", system: "Sugestão local", error: "Erro"
    }[role] || role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if(isHtml){
      bubble.innerHTML = htmlOrText;
    } else if(role === "assistant"){
      bubble.innerHTML = renderMarkdown(htmlOrText);
    } else {
      bubble.textContent = htmlOrText;
    }
    wrap.innerHTML = `<div class="role-label">${label}</div>`;
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return {wrap, bubble};
  }

  /* ---------------------------------------------------------------------
     MARKDOWN BÁSICO — renderização simples e segura (escapa HTML primeiro)
     das respostas da IA: negrito, itálico, código, links e listas.
     --------------------------------------------------------------------- */
  function renderMarkdown(text){
    let html = escapeHtml(text);
    html = html.replace(/```([\s\S]*?)```/g, (m, code) => "<pre><code>" + code.replace(/^\n/, "") + "</code></pre>");
    html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    html = html.replace(/(^|\n)((?:- .+(?:\n|$))+)/g, (m, pre, block) => {
      const items = block.replace(/\n$/, "").split("\n").map(l => "<li>" + l.replace(/^- /, "") + "</li>").join("");
      return pre + "<ul>" + items + "</ul>";
    });
    return html;
  }

  /* ---------------------------------------------------------------------
     PERSISTÊNCIA DO CHAT NA SESSÃO — sessionStorage (limpa ao fechar o
     separador; propositadamente não usa localStorage, por privacidade)
     --------------------------------------------------------------------- */
  function persistChatSession(){
    try{ sessionStorage.setItem(LS_KEYS.chatSession, JSON.stringify(state.chatHistory)); } catch(e){}
  }
  function loadChatSession(){
    try{
      const raw = sessionStorage.getItem(LS_KEYS.chatSession);
      if(raw) state.chatHistory = JSON.parse(raw);
    } catch(e){ state.chatHistory = []; }
  }

  function handleSendChat(forceAi){
    const chatInput = document.getElementById("chatInput");
    if(!chatInput) return;
    const text = chatInput.value.trim();
    if(!text) return;

    chatInput.value = "";
    chatInput.style.height = "auto";

    state.chatHistory.push({role:"user", content:text});
    persistChatSession();
    appendChatBubble("user", text, false);

    if(!forceAi){
      const localMatches = searchLocal(text);
      if(localMatches.length > 0){
        const best = localMatches[0];
        const html = `
          <div class="suggestion-card">
            <div class="title">💡 Encontrei isto no protocolo local:</div>
            <div>${escapeHtml(best.cat.name)} — <strong>${escapeHtml(best.sub.title)}</strong><br>
            <span style="color:var(--color-text-muted);">${escapeHtml(best.sub.summary)}</span></div>
            <div class="actions">
              <button type="button" class="btn secondary" data-action="view" data-cat="${best.cat.id}" data-sub="${best.sub.id}">Ver resolução</button>
              <button type="button" class="btn" data-action="ask-ai">Perguntar à IA mesmo assim</button>
            </div>
          </div>
        `;
        appendChatBubble("system", html, true);
        const log = document.getElementById("chatLog");
        const lastCard = log.lastElementChild.querySelector(".suggestion-card");
        lastCard.querySelector('[data-action="view"]').addEventListener("click", (e) => {
          selectSubtopic(e.target.dataset.cat, e.target.dataset.sub);
        });
        lastCard.querySelector('[data-action="ask-ai"]').addEventListener("click", () => {
          callAi(text);
        });
        return;
      }
    }

    callAi(text);
  }

  function setTyping(on){
    const t = document.getElementById("chatTyping");
    if(t) t.classList.toggle("active", on);
  }

  function callAi(userText){
    const key = getApiKey();
    if(!key){
      appendChatBubble("error", "Não há nenhuma chave de API guardada. Adiciona a tua chave da Anthropic acima para usares o assistente.", false);
      return;
    }

    setTyping(true);
    const sendBtn = document.getElementById("btnSendChat");
    const stopBtn = document.getElementById("btnStopChat");
    if(sendBtn) sendBtn.disabled = true;
    if(stopBtn) stopBtn.style.display = "inline-flex";

    const messages = state.chatHistory
      .filter(m => m.role === "user" || m.role === "assistant")
      .map(m => ({role: m.role, content: m.content}));

    const controller = new AbortController();
    state.abortController = controller;

    const streamRef = createStreamingAssistantBubble();
    let fullText = "";

    fetch(AI_CONFIG.apiEndpoint, {
      method: "POST",
      signal: controller.signal,
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": AI_CONFIG.apiVersion,
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: AI_CONFIG.model,
        max_tokens: AI_CONFIG.maxTokens,
        system: AI_CONFIG.systemPrompt,
        messages: messages,
        stream: true
      })
    })
    .then(async (res) => {
      if(!res.ok){
        const bodyText = await res.text();
        let body = {};
        try{ body = JSON.parse(bodyText); } catch(e){ /* resposta não-JSON */ }
        throw {status: res.status, body};
      }
      setTyping(false);

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while(true){
        const {done, value} = await reader.read();
        if(done) break;
        buffer += decoder.decode(value, {stream: true});
        const lines = buffer.split("\n");
        buffer = lines.pop(); // guarda a linha incompleta para o próximo pedaço

        for(const line of lines){
          if(!line.startsWith("data:")) continue;
          const dataStr = line.slice(5).trim();
          if(!dataStr) continue;
          let evt;
          try{ evt = JSON.parse(dataStr); } catch(e){ continue; }

          if(evt.type === "content_block_delta" && evt.delta && evt.delta.type === "text_delta"){
            fullText += evt.delta.text;
            updateStreamingAssistantBubble(streamRef, fullText, true);
          } else if(evt.type === "error"){
            throw {status: 0, body: {error: evt.error}};
          }
        }
      }
    })
    .then(() => {
      updateStreamingAssistantBubble(streamRef, fullText, false);
      if(fullText){
        state.chatHistory.push({role: "assistant", content: fullText});
        persistChatSession();
      } else {
        streamRef.wrap.remove();
      }
    })
    .catch(err => {
      if(err && err.name === "AbortError"){
        updateStreamingAssistantBubble(streamRef, fullText, false);
        if(fullText){
          state.chatHistory.push({role: "assistant", content: fullText + "\n\n_(interrompido pelo utilizador)_"});
          persistChatSession();
        } else {
          streamRef.wrap.remove();
        }
        return;
      }
      streamRef.wrap.remove();
      appendChatBubble("error", formatApiError(err), false);
    })
    .finally(() => {
      setTyping(false);
      if(sendBtn) sendBtn.disabled = false;
      if(stopBtn) stopBtn.style.display = "none";
      state.abortController = null;
    });
  }

  function createStreamingAssistantBubble(){
    const log = document.getElementById("chatLog");
    const wrap = document.createElement("div");
    wrap.className = "chat-msg assistant";
    wrap.innerHTML = `<div class="role-label">Assistente IA</div>`;
    const bubble = document.createElement("div");
    bubble.className = "bubble cursor-blink";
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return {wrap, bubble};
  }
  function updateStreamingAssistantBubble(ref, text, streaming){
    ref.bubble.innerHTML = renderMarkdown(text);
    ref.bubble.classList.toggle("cursor-blink", streaming);
    const log = document.getElementById("chatLog");
    log.scrollTop = log.scrollHeight;
  }

  /* ---------------------------------------------------------------------
     TESTAR CHAVE — pedido mínimo (max_tokens:1) só para validar a chave
     sem gastar praticamente nenhum token
     --------------------------------------------------------------------- */
  function testApiKey(){
    const key = getApiKey();
    const resultEl = document.getElementById("testKeyResult");
    const testBtn = document.getElementById("btnTestKey");
    if(!key || !resultEl) return;

    testBtn.disabled = true;
    resultEl.textContent = "A testar…";
    resultEl.style.color = "var(--color-text-muted)";

    fetch(AI_CONFIG.apiEndpoint, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": AI_CONFIG.apiVersion,
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: AI_CONFIG.model,
        max_tokens: 1,
        messages: [{role: "user", content: "ok"}]
      })
    })
    .then(async (res) => {
      if(!res.ok){
        const bodyText = await res.text();
        let body = {};
        try{ body = JSON.parse(bodyText); } catch(e){ /* resposta não-JSON */ }
        throw {status: res.status, body};
      }
      resultEl.textContent = "✓ Chave válida.";
      resultEl.style.color = "var(--success)";
    })
    .catch(err => {
      resultEl.textContent = "✗ " + formatApiError(err);
      resultEl.style.color = "var(--danger)";
    })
    .finally(() => {
      testBtn.disabled = false;
    });
  }

  function formatApiError(err){
    if(!err || typeof err !== "object" || !("status" in err)){
      return "Não foi possível contactar a IA. Verifica a tua ligação à internet e tenta novamente.";
    }
    const status = err.status;
    const apiMsg = err.body && err.body.error && err.body.error.message;

    if(status === 401){
      return "Chave de API inválida ou sem permissões. Verifica se colaste a chave corretamente (remove-a e adiciona de novo, se necessário).";
    }
    if(status === 0){
      return "A IA interrompeu a resposta a meio" + (apiMsg ? (": " + apiMsg) : ".") + " Tenta novamente.";
    }
    if(status === 429){
      return "Limite de pedidos atingido (rate limit) na tua conta Anthropic. Aguarda um pouco e tenta novamente.";
    }
    if(status === 400){
      return "O pedido enviado à IA foi rejeitado" + (apiMsg ? (": " + apiMsg) : ".") ;
    }
    if(status >= 500){
      return "O serviço de IA da Anthropic está indisponível de momento. Tenta novamente dentro de instantes.";
    }
    return "Ocorreu um erro ao contactar a IA (código " + status + ")" + (apiMsg ? (": " + apiMsg) : ".");
  }

  /* =========================================================================
     PESQUISA — ligação da caixa do cabeçalho
     ========================================================================= */
  function wireSearch(){
    const input = document.getElementById("searchInput");
    let debounceTimer = null;
    input.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const q = input.value.trim();
        if(q){
          state.selected = null;
          renderSearchResults(q);
        } else if(!state.selected){
          renderWelcome();
        }
      }, 180);
    });
    input.addEventListener("keydown", (e) => {
      if(e.key === "Enter"){
        e.preventDefault();
        const q = input.value.trim();
        if(q) renderSearchResults(q);
      }
    });
  }

  /* ---------------------------------------------------------------------
     APAGAR TODOS OS DADOS LOCAIS — estilo RGPD: um único botão para
     remover tudo o que a app guardou neste browser
     --------------------------------------------------------------------- */
  function clearAllLocalData(){
    const ok = confirm(
      "Isto vai apagar do teu browser: a chave de API guardada, favoritos, " +
      "vistos recentemente, feedback e preferências de modo/tema.\n\n" +
      "Esta ação não pode ser desfeita. Continuar?"
    );
    if(!ok) return;
    Object.keys(localStorage).forEach(k => {
      if(k.indexOf("resolveflow_") === 0) localStorage.removeItem(k);
    });
    sessionStorage.removeItem(LS_KEYS.chatSession);
    showToast("Todos os dados locais foram apagados.");
    setTimeout(() => location.reload(), 700);
  }

  /* ---------------------------------------------------------------------
     SINCRONIZAÇÃO ENTRE SEPARADORES — se mudares o modo, a chave ou o
     tema noutro separador aberto, este atualiza-se sozinho
     --------------------------------------------------------------------- */
  function handleStorageSync(e){
    if(e.key === LS_KEYS.mode){
      const newMode = e.newValue === "online" ? "online" : "offline";
      if(newMode !== state.mode){
        state.mode = newMode;
        document.getElementById("btnModeOffline").classList.toggle("active", newMode === "offline");
        document.getElementById("btnModeOffline").setAttribute("aria-selected", newMode === "offline");
        document.getElementById("btnModeOnline").classList.toggle("active", newMode === "online");
        document.getElementById("btnModeOnline").setAttribute("aria-selected", newMode === "online");
        updatePrivacyBanner();
        rerenderCurrentPanelKeepingChat();
        showToast("Modo atualizado noutro separador.");
      }
    } else if(e.key === LS_KEYS.apiKey){
      rerenderCurrentPanelKeepingChat();
    } else if(e.key === LS_KEYS.theme){
      applyTheme(getStoredTheme());
    } else if(e.key === LS_KEYS.favorites || e.key === LS_KEYS.recent){
      renderSideLists();
    }
  }

  /* =========================================================================
     INIT
     ========================================================================= */
  function init(){
    const savedMode = localStorage.getItem(LS_KEYS.mode);
    state.mode = (savedMode === "online") ? "online" : "offline";

    applyTheme(getStoredTheme());
    loadChatSession();
    renderTree();
    renderSideLists();
    wireSearch();
    wireKeyboardShortcuts();

    document.getElementById("btnModeOffline").addEventListener("click", () => setMode("offline"));
    document.getElementById("btnModeOnline").addEventListener("click", () => setMode("online"));
    document.getElementById("btnThemeToggle").addEventListener("click", toggleTheme);
    document.getElementById("btnClearAllData").addEventListener("click", clearAllLocalData);

    document.getElementById("btnModeOffline").classList.toggle("active", state.mode === "offline");
    document.getElementById("btnModeOnline").classList.toggle("active", state.mode === "online");
    document.getElementById("btnModeOffline").setAttribute("aria-selected", state.mode === "offline");
    document.getElementById("btnModeOnline").setAttribute("aria-selected", state.mode === "online");

    updatePrivacyBanner();

    const routed = applyHashRoute();
    if(!routed) renderWelcome();

    window.addEventListener("popstate", applyHashRoute);
    window.addEventListener("hashchange", applyHashRoute);
    window.addEventListener("storage", handleStorageSync);
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
